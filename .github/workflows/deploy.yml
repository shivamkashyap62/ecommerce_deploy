name: CI/CD Pipeline - Test & Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Job 1: Parallel Backend Testing
  test-backend:
    name: Test Backend (Django Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-environment-secret-key-12345'
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: |
          python clothes_donation/manage.py test clothes_donation

  # Job 2: Parallel Frontend Testing (Django Template Linting)
  test-frontend:
    name: Test Frontend (HTML & Template Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install djlint

      - name: Check Django HTML Templates Formatting & Syntax
        run: |
          # djlint checks formatting and template tags of HTML files in our project
          djlint clothes_donation/ --check

  # Job 3: Build, Push to Docker Hub, and Deploy to Render
  # Runs only if both backend and frontend tests pass, and only on master/main branch pushes
  build-and-deploy:
    name: Build Docker Image, Push to Docker Hub & Deploy
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'username' dynamically via your GitHub Secrets or Docker Hub settings
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clothes-donation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clothes-donation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Deploy on Render via Webhook Hook
        run: |
          echo "Triggering deployment on Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully!"
