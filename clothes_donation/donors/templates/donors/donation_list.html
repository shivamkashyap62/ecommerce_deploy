{% extends "base.html" %}
{% block content %}
    <h2 class="mb-3">Donations</h2>
    <a href="/donors/add/" class="btn btn-success mb-3">Add Donation</a>
    <div class="row">
        {% for d in donations %}
            <div class="col-md-4">
                <div class="card mb-3">
                    {% if d.image %}<img src="{{ d.image.url }}" class="card-img-top">{% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ d.title }}</h5>
                        <p class="card-text">{{ d.description }}</p>
                        <p class="text-muted">{{ d.location }}</p>
                        <a href="/donors/{{ d.id }}/requests/" class="btn btn-sm btn-primary">View Requests</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
