{% extends "base.html" %}
{% block content %}
    <div class="card glass-card form-container border-0 animate-fade-in">
        <h2 class="text-center mb-3">Create Account</h2>
        <p class="text-center text-white-50 mb-4">Register as a Donor or Receiver to get started.</p>
        {% if errors %}
            <div class="alert alert-danger bg-danger-subtle border-0 text-danger-emphasis mb-4 py-2 px-3 rounded-3"
                 role="alert">
                {% for error in errors %}<p class="mb-0 fs-6">⚠️ {{ error }}</p>{% endfor %}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username">Username</label>
                <input type="text"
                       name="username"
                       id="username"
                       class="form-control"
                       placeholder="Choose a username"
                       required>
            </div>
            <div class="mb-3">
                <label for="password">Password</label>
                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Create a strong password"
                       required>
            </div>
            <div class="mb-4">
                <label for="role">Select Your Role</label>
                <select name="role" id="role" class="form-select" required>
                    <option value="donor">Donor (I want to donate clothes)</option>
                    <option value="receiver">Receiver (I want to request clothes)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-premium btn-premium-primary w-100 mb-3">Register Now</button>
            <p class="text-center text-white-50 mb-0">
                Already have an account? <a href="/login/" class="text-gradient fw-bold text-decoration-none">Login here</a>
            </p>
        </form>
    </div>
{% endblock %}
