{% extends "base.html" %}
{% block content %}
    <div class="card glass-card form-container border-0 animate-fade-in">
        <h2 class="text-center mb-4">Welcome Back</h2>
        <p class="text-center text-white-50 mb-4">Please log in to manage your donations and requests.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username">Username</label>
                <input type="text"
                       name="username"
                       id="username"
                       class="form-control"
                       placeholder="Enter your username"
                       required>
            </div>
            <div class="mb-4">
                <label for="password">Password</label>
                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>
            </div>
            <button type="submit" class="btn btn-premium btn-premium-primary w-100 mb-3">Sign In</button>
            <p class="text-center text-white-50 mb-0">
                Don't have an account? <a href="/register/" class="text-gradient fw-bold text-decoration-none">Register here</a>
            </p>
        </form>
    </div>
{% endblock %}
